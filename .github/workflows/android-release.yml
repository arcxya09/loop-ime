name: Android build and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Test and build
        run: |
          python3 scripts/materialize-dependencies.py
          bash gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Package verified source and APK
        run: python3 scripts/package-release.py --apk app/build/outputs/apk/release/app-release.apk --test-results app/build/test-results/testDebugUnitTest --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist
      - name: Publish stable release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py --bundle dist --repo '${{ github.repository }}'
